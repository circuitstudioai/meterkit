name: Alpha contracts
on: [push, pull_request]
permissions:
  contents: read
jobs:
  billing:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: meterkit_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      METERKIT_TEST_DATABASE_URL: postgres://postgres:test-only@localhost:5432/meterkit_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck -w @meterkit/billing
      - run: npm run build
